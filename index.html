<style>

input,select,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--br);border-radius:12px;padding:10px 12px;width:100%}label{display:block;font-size:12px;color:var(--mu);margin:10px 0 4px}
.btn{background:var(--pri);color:#fff;border:0;border-radius:14px;padding:11px 16px;font:inherit;font-weight:700;cursor:pointer;transition:.15s;text-decoration:none;display:inline-block}.btn:hover{transform:translateY(-2px);filter:brightness(1.1)}.btn.s{background:var(--br);color:var(--tx)}.btn.d{background:var(--P)}

.ft{text-align:center;color:var(--mu);font-size:13px;margin:26px 0 6px;padding-top:14px;border-top:1px solid var(--br)}.ft a{color:var(--pri);font-weight:700;text-decoration:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.sp{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
</style></head><body>
<nav id="nav"><div class="logo"><img src="logo.svg" alt="">Pennylight</div></nav><main id="main"></main>
<button class="fab" data-act="add" aria-label="Add transaction">+</button><dialog id="dlg"></dialog><input type="file" id="file" accept=".xlsx,.xls" hidden>
<script>
const ESS='Essential',VAL='Value-Aligned',PHA='Phantom Spend',CL={[ESS]:{n:'Needed',c:'var(--E)',i:'🧱'},[VAL]:{n:'Valued',c:'var(--V)',i:'💎'},[PHA]:{n:"Can't remember why",c:'var(--P)',i:'👻'}};
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=(n,l)=>String(n).padStart(l,'0'),iso=d=>{const x=new Date(d);return x.getFullYear()+'-'+pad(x.getMonth()+1,2)+'-'+pad(x.getDate(),2)};
const today=()=>iso(new Date()),money=n=>fmt().format(n),uid=()=>Math.random().toString(36).slice(2,10),pc=p=>Math.round(p*100)+'%';
const CATS=[['Housing','Essentials'],['Food & Groceries','Essentials'],['Eating Out','Lifestyle'],['Transport','Essentials'],['Data & Airtime','Essentials'],['Utilities','Essentials'],['Healthcare','Essentials'],['Education','Growth'],['Family Support','Family'],['Debt Repayment','Financial'],['Savings & Investments','Financial'],['Entertainment','Lifestyle'],['Shopping','Lifestyle'],['Personal Care','Lifestyle'],['Subscriptions','Lifestyle'],['Gifts & Donations','Giving'],['Fees & Charges','Financial'],['Laundry','Lifestyle'],['Courtship','Lifestyle'],['Friends','Family'],['Business','Financial'],['Other','Other']].map(([name,grp],i)=>({id:'CAT'+pad(i+1,3),name,grp,type:'Expense',on:1}));
const ACCS=[['Main Bank Account','Bank'],['Savings Account','Bank'],['Cash Wallet','Cash'],['Other','Other']].map(([name,type],i)=>({id:'ACC'+pad(i+1,3),name,type,open:0,on:1}));
const ITYPES=['Salary','Business','Freelance','Interest','Dividend','Gift','Other'],K='pennylight.v1';
const fresh=()=>({cats:CATS,accts:ACCS,tx:[],inc:[],bud:[],set:{remind:7,last:null,ack:false,cur:''}});
let S;try{S={...fresh(),...JSON.parse(localStorage.getItem(K)||localStorage.getItem('pennylight.v1')||'{}')}}catch(e){S=fresh()}
const CUR=[['NGN','Nigerian Naira','en-NG','Africa',0,5000],['GHS','Ghanaian Cedi','en-GH','Africa',2,100],['XOF','West African CFA franc','fr-SN','Africa',0,5000],['XAF','Central African CFA franc','fr-CM','Africa',0,5000],['KES','Kenyan Shilling','en-KE','Africa',0,1000],['ZAR','South African Rand','en-ZA','Africa',2,150],['USD','US Dollar','en-US','The Americas',2,10],['CAD','Canadian Dollar','en-CA','The Americas',2,15],['MXN','Mexican Peso','es-MX','The Americas',2,200],['BRL','Brazilian Real','pt-BR','The Americas',2,50],['AUD','Australian Dollar','en-AU','Asia & Oceania',2,15],['AED','UAE Dirham','en-AE','Asia & Oceania',2,40],['INR','Indian Rupee','en-IN','Asia & Oceania',0,500],['GBP','Pound Sterling','en-GB','Europe',2,8],['EUR','Euro','en-IE','Europe',2,10]],GR=['Africa','The Americas','Asia & Oceania','Europe'];
if(S.set.ack&&!S.set.cur)S.set.cur='NGN';
const cu=()=>CUR.find(c=>c[0]===S.set.cur)||CUR[6],SM=()=>cu()[5],sym=()=>new Intl.NumberFormat(cu()[2],{style:'currency',currency:cu()[0]}).formatToParts(0).find(p=>p.type==='currency').value;let _c,_f;
const fmt=()=>{const c=cu();if(_c!==c[0]){_c=c[0];_f=new Intl.NumberFormat(c[2],{style:'currency',currency:c[0],minimumFractionDigits:c[4],maximumFractionDigits:c[4]})}return _f};
const sc=n=>{const f=SM()/5000*n;return cu()[4]?Math.round(f):Math.round(f*100)/100};
const curOpts=()=>GR.map(g=>`<optgroup label="${g}">${CUR.filter(c=>c[3]===g).map(c=>`<option value="${c[0]}" ${c[0]===S.set.cur?'selected':''}>${c[1]} (${c[0]})</option>`).join('')}</optgroup>`).join('');
const guess=()=>({NG:'NGN',GH:'GHS',SN:'XOF',CI:'XOF',CM:'XAF',KE:'KES',ZA:'ZAR',US:'USD',CA:'CAD',MX:'MXN',BR:'BRL',AU:'AUD',AE:'AED',IN:'INR',GB:'GBP',DE:'EUR',FR:'EUR',ES:'EUR',IT:'EUR',IE:'EUR',NL:'EUR'})[(navigator.language||'').split('-')[1]]||'USD';
let T={tab:'dash',month:today().slice(0,7),q:'',f:''};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){toast('⚠️ Browser storage blocked/full — export a backup now!')}};
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),3200)}
const sum=a=>a.reduce((s,x)=>s+x.amt,0),inM=(d,m)=>d.startsWith(m),exp=()=>S.tx.filter(t=>t.type==='Expense');
const cat=id=>S.cats.find(c=>c.id===id)?.name||'Uncategorised',acc=id=>S.accts.find(a=>a.id===id)?.name||'';
const cls=ex=>({[ESS]:sum(ex.filter(t=>t.cls===ESS)),[VAL]:sum(ex.filter(t=>t.cls===VAL)),[PHA]:sum(ex.filter(t=>t.cls===PHA))});
function stats(m){const ex=exp().filter(t=>inM(t.date,m)),inc=sum(S.inc.filter(t=>inM(t.date,m))),e=sum(ex);return{inc,e,sav:inc-e,rate:inc?(inc-e)/inc:0,c:cls(ex),ex}}
const win=()=>exp().filter(t=>t.date>=iso(Date.now()-30*864e5)&&t.date<=today());
const mlab=m=>new Date(m+'-15').toLocaleString('en',{month:'long',year:'numeric'});
function months(n){const r=[],d=new Date();d.setDate(1);for(let i=n-1;i>=0;i--){const x=new Date(d.getFullYear(),d.getMonth()-i,1);r.push(x.getFullYear()+'-'+pad(x.getMonth()+1,2))}return r}
function donut(c){const t=c[ESS]+c[VAL]+c[PHA]||1,R=42,L=2*Math.PI*R;let o=0;return`<svg viewBox="0 0 100 100" class="donut"><circle cx="50" cy="50" r="${R}" fill="none" stroke="var(--br)" stroke-width="12"/>`+[ESS,VAL,PHA].map(k=>{const l=c[k]/t*L,s=`<circle class="seg" cx="50" cy="50" r="${R}" fill="none" stroke="${CL[k].c}" stroke-width="12" stroke-dasharray="${l} ${L-l}" stroke-dashoffset="${-o}" transform="rotate(-90 50 50)"/>`;o+=l;return s}).join('')+`<text x="50" y="48" text-anchor="middle" font-size="9" fill="var(--mu)">30 days</text><text x="50" y="62" text-anchor="middle" font-size="13" font-weight="800" fill="var(--tx)">${t>1?pc(c[PHA]/t):'—'}</text></svg>`}
function insights(m){const s=stats(m),T0=s.e,o=[];if(T0){const p=s.c[PHA]/T0;o.push(p>.25?`👻 ${pc(p)} of this month's spending is Phantom — ${money(s.c[PHA])}. Halve it and ${money(s.c[PHA]/2)} returns to you.`:p>.1?`👀 Phantom spend is ${pc(p)} (${money(s.c[PHA])}). Watch the small stuff before it grows.`:`✅ Phantom spend is only ${pc(p)}. Your money has direction.`)}
const sm=s.ex.filter(t=>t.amt<=SM());if(sm.length>=5)o.push(`🐜 ${sm.length} small purchases (≤${money(SM())}) added up to ${money(sum(sm))}. Small is not harmless.`);
const rp=s.ex.filter(t=>t.rec&&t.cls===PHA);if(rp.length)o.push(`🔁 ${rp.length} recurring charge(s) are tagged Phantom. Cancel one today.`);
if(s.inc)o.push(s.rate<.2?`💡 Pay yourself first: move ${money(s.inc*.1)} (10% of income) to savings the day money lands.`:`🌱 Savings rate ${pc(s.rate)} — strong. Phase 2 will help put it to work.`);
if(!o.length)o.push('✍️ Log every purchase for 30 days — even the tiny ones. Visibility is the whole game.');return o}
const label=t=>t.type==='Income'?t.label:cat(t.cat);
const row=t=>`<div class="tr" data-act="edit" data-id="${t.id}"><span class="dot">${t.type==='Income'?'💰':CL[t.cls]?.i||'↔'}</span><div class="gr"><b>${esc(t.desc||label(t))}</b><small>${t.date} · ${esc(label(t))}${t.rec?' · 🔁':''}</small></div><b class="${t.type==='Income'?'pos':''}">${t.type==='Income'?'+':'−'}${money(t.amt)}</b></div>`;
const all=()=>[...S.tx,...S.inc.map(i=>({id:i.id,date:i.date,type:'Income',desc:i.src,label:i.itype,amt:i.amt,rec:i.rec}))].sort((a,b)=>b.date.localeCompare(a.date));
const mpick=`<input type="month" value="${'${M}'}" data-ch="month">`;
const banner=()=>{const d=S.set.last?(Date.now()-new Date(S.set.last))/864e5:99999;let h=`<div class="warn"><span>🔒 <b>Your data is stored only in this browser.</b> Clearing site data or changing device erases it. Back up to Excel regularly.</span>`;if(S.set.remind&&d>=S.set.remind)h+=`<button class="btn" data-act="export">⏰ Back up now</button>`;return h+`</div>`};
const V={dash(){const m=T.month,s=stats(m),w=cls(win()),tw=w[ESS]+w[VAL]+w[PHA],h=new Date().getHours();
const kp=(a,b,n,p)=>`<div class="card"><div class="k">${a}</div><div class="big ${b}" data-n="${n}" ${p?'data-p=1':''}>0</div></div>`;
const empty=!S.tx.length&&!S.inc.length;
return banner()+`<div class="hero"><h1>${h<12?'Good morning':h<17?'Good afternoon':'Good evening'} 👋</h1><p>Money you can see is money you can steer.</p><input type="month" value="${m}" data-ch="month"></div>`+(empty?`<div class="card" style="text-align:center"><h2>Start your 30-day Spend Clarity Challenge</h2><p class="mu">Tap + and log every spend — transport, data, lunch, even boredom buys.</p><div class="sp" style="justify-content:center"><button class="btn" data-act="add">Log first entry</button><button class="btn s" data-act="sample">Try with sample data</button></div></div>`:'')+
`<div class="g">${kp('Income','pos',s.inc)}${kp('Expenses','neg',s.e)}${kp('Savings',s.sav<0?'neg':'',s.sav)}${kp('Savings rate','',s.rate*100,1)}</div>
<div class="g" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))"><div class="card"><h2>30-Day Spend Clarity</h2><div class="row">${donut(w)}<div class="lg">${[ESS,VAL,PHA].map(k=>`<div><span><i style="background:${CL[k].c}"></i>${CL[k].i} ${CL[k].n}</span><b>${money(w[k])} <small>${tw?pc(w[k]/tw):''}</small></b></div>`).join('')}</div></div></div>
<div class="card"><h2>Your coach says</h2>${insights(m).map(x=>`<div class="tip">${x}</div>`).join('')}</div></div>
<div class="card"><h2>Recent activity</h2>${all().slice(0,6).map(row).join('')||'<p class="mu">Nothing yet.</p>'}<div class="sp"><button class="btn s" data-act="tab" data-t="tx">See all</button></div></div>`},
tx(){const l=all().filter(t=>(!T.f||t.cls===T.f||(T.f==='Income'&&t.type==='Income'))&&(!T.q||(t.desc+label(t)+(t.merch||'')).toLowerCase().includes(T.q.toLowerCase())));
return`<h2 style="margin-top:6px">Transactions</h2><input placeholder="🔍 Search…" value="${esc(T.q)}" data-ch="q" style="margin-bottom:10px"><div class="chips">${[['','All'],[ESS,'🧱 Needed'],[VAL,'💎 Valued'],[PHA,'👻 Phantom'],['Income','💰 Income']].map(([v,n])=>`<button class="chip ${T.f===v?'on':''}" data-act="f" data-v="${v}">${n}</button>`).join('')}</div><div class="card">${l.slice(0,300).map(row).join('')||'<p class="mu">No matching entries.</p>'}</div>`},
ana(){const m=T.month,s=stats(m),ms=months(6),d=ms.map(x=>stats(x)),mx=Math.max(1,...d.map(x=>Math.max(x.inc,x.e)));
const cm={};s.ex.forEach(t=>cm[t.cat]=(cm[t.cat]||0)+t.amt);const bd=id=>S.bud.find(b=>b.m===m&&b.cat===id)?.amt||0,cr=[...new Set([...Object.keys(cm),...S.bud.filter(b=>b.m===m&&b.amt).map(b=>b.cat)])].sort((a,b)=>(cm[b]||0)-(cm[a]||0)),cx=Math.max(1,...cr.map(i=>Math.max(cm[i]||0,bd(i))));
const g={};win().filter(t=>t.cls===PHA).forEach(t=>{const k=(t.merch||t.desc||'?').trim().toLowerCase();g[k]=g[k]||{n:t.merch||t.desc,a:0,c:0};g[k].a+=t.amt;g[k].c++});const tp=Object.values(g).sort((a,b)=>b.a-a.a).slice(0,6),sm=s.ex.filter(t=>t.amt<=SM());
return`<h2 style="margin-top:6px">Analytics <input type="month" value="${m}" data-ch="month" style="width:auto;margin-left:8px"></h2>
